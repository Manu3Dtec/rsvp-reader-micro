  <circle cx="590" cy="93" r="10" fill="#ff453a"/>
  <text x="480" y="202" fill="#9a9aa1" font-family="Arial,Helvetica,sans-serif" font-size="38" font-weight="500" text-anchor="middle" letter-spacing="10">READER</text>
</svg>
